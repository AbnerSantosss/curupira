# CURUPIRA num servidor.
#
#   CURUPIRA_ACCESS_KEY=uma-senha-longa docker compose up -d --build
#
# A porta fica presa ao 127.0.0.1 do host: quem publica para fora é o túnel
# (Cloudflare Tunnel, Caddy, Nginx…), nunca o Docker direto na internet.

services:
  curupira:
    build: .
    image: curupira:latest
    container_name: curupira
    restart: unless-stopped
    environment:
      # Liga o portão de senha. Sem ela o app fica aberto para quem achar o link.
      CURUPIRA_ACCESS_KEY: ${CURUPIRA_ACCESS_KEY:?defina CURUPIRA_ACCESS_KEY}
      # Horas até um arquivo baixado ser apagado do servidor (0 = nunca).
      CURUPIRA_RETENTION_HOURS: ${CURUPIRA_RETENTION_HOURS:-6}
      # URL pública do app, com https e sem barra no fim. Usada nos cartões de compartilhamento.
      CURUPIRA_PUBLIC_URL: ${CURUPIRA_PUBLIC_URL:-}
      # 1 = atualiza o yt-dlp a cada subida do container.
      CURUPIRA_UPDATE_YTDLP: ${CURUPIRA_UPDATE_YTDLP:-1}
    ports:
      - "127.0.0.1:${CURUPIRA_PORT:-3055}:3000"
    volumes:
      - curupira-downloads:/data/downloads

volumes:
  curupira-downloads:
